backend:
  name: github
  repo: lpc205/Blog
  branch: main
  base_url: https://blog.187027.xyz
  auth_endpoint: auth
locale: zh_Hans
media_folder: "src/assets/images/posts"
public_folder: "/src/assets/images/posts"
collections:
  - name: posts
    label: 文章
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "published", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "摘要", name: "description", widget: "text", required: false }
      - { label: "头图", name: "image", widget: "image", required: false }
      - { label: "标签", name: "tags", widget: "list", required: false }
      - { label: "分类", name: "category", widget: "string", required: false }
      - { label: "草稿", name: "draft", widget: "boolean", default: false }
      - { label: "正文", name: "body", widget: "markdown" }
